global:
  # How frequently Prometheus scrapes targets.
  scrape_interval: 15s
  # How frequently Prometheus evaluates recording/alerting rules (none by default here).
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Scrape Django application metrics exposed by django-prometheus at /metrics.
  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  # Postgres exporter exposes database-level metrics (connections, locks, WAL, etc.).
  - job_name: postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  # Redis exporter exposes Redis server stats (commands, memory, clients, etc.).
  - job_name: redis
    static_configs:
      - targets:
          - redis_exporter:9121

  # Celery worker exposes task-level metrics via prometheus_client HTTP server.
  - job_name: celery
    metrics_path: /metrics
    static_configs:
      - targets:
          - celery_worker:8001
