services:
  api:
    build: .
    entrypoint: [ "/bin/sh", "/app/entrypoint.sh" ]

    command: >
      python -Xfrozen_modules=off -m debugpy
      --listen 0.0.0.0:5678
      -m uvicorn app.asgi:application
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - .:/app

    env_file:
      - .env
    environment:
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-0}
      FCM_CREDENTIAL_PATH: ${FCM_CREDENTIAL_PATH:-/app/firebase-service-account.json}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monitoring/postgres/init:/docker-entrypoint-initdb.d:ro

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rental_db}

    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c track_activity_query_size=2048

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rental_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - backend

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  celery_worker:
    build: .
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: celery -A app.core.celery_app worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-0}
      FCM_CREDENTIAL_PATH: ${FCM_CREDENTIAL_PATH:-/app/firebase-service-account.json}
      CELERY_METRICS_ENABLED: ${CELERY_METRICS_ENABLED:-1}
      CELERY_METRICS_PORT: ${CELERY_METRICS_PORT:-8001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  celery_beat:
    build: .
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: celery -A app.core.celery_app beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-0}
      FCM_CREDENTIAL_PATH: ${FCM_CREDENTIAL_PATH:-/app/firebase-service-account.json}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - postgres_exporter
      - redis_exporter
      - alertmanager
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - backend

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rental_db}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - backend

  redis_exporter:
    image: oliver006/redis_exporter:v1.63.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    networks:
      - backend

  flower:
    image: mher/flower:2.0
    command: celery --broker=${REDIS_URL:-redis://redis:6379/0} flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  backend:
    driver: bridge
